name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The backend and the frontend are typechecked separately: convex/ has its
      # own tsconfig and its own runtime, and a change that only breaks one of
      # them is exactly the change that slips through otherwise.
      - name: Typecheck the backend
        run: npx tsc -p convex --noEmit
      - name: Typecheck and build the frontend
        run: npm run build
